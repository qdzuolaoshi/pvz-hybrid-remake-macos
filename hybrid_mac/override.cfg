; macOS port of 植物大战僵尸杂交重制版: project-setting overrides. build_hybrid_app.sh adds this file to the app's
; copy of the pack as res://override.cfg, which the engine reads after res://project.binary.

[autoload]

; Sounds for buttons that the game data leaves silent (main-menu mode buttons, back arrows, NinePatch buttons).
UiSfxPatch="*res://MacPort/ui_sfx_patch.gd"
; Plant-name tooltip under a hovered seed packet (absent from the 0.31 remake on every platform).
PvzhPacketNameTooltip="*res://MacPort/packet_name_tooltip.gd"

[display]

; Present frames in step with the display. The project ships with vsync off, which makes the frame limiter drift
; against the 60 Hz panel (dropped and repeated frames). The game sets its own frame cap at runtime from
; Options > 动画帧率 (default 30, max 60) and overwrites application/run/max_fps, so the cap is not set here.
window/vsync/vsync_mode=1
